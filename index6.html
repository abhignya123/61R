<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display & Combinators</title>
  <link rel="stylesheet" href="style5.css">
</head>
<body>

<header>
  <h1>CSS Display Properties & Combinators</h1>
</header>

<!-- DISPLAY PROPERTIES -->
<section>
  <h2>Display Properties (Horizontal)</h2>

  <div class="row">

    <div class="card block">
      <img src="https://picsum.photos/200/120?1">
      <p>Block</p>
    </div>

    <div class="card inline-block">
      <img src="https://picsum.photos/200/120?2">
      <p>Inline-Block</p>
    </div>

    <div class="card inline-block">
      <img src="https://picsum.photos/200/120?3">
      <p>Inline-Block</p>
    </div>

    <div class="card inline-block">
      <img src="https://picsum.photos/200/120?4">
      <p>Inline-Block</p>
    </div>

  </div>
</section>

<!-- FLEX -->
<section>
  <h2>Flex Display</h2>

  <div class="row">

    <div class="card flex-item">
      <img src="https://picsum.photos/200/120?5">
      <p>Flex 1</p>
    </div>

    <div class="card flex-item">
      <img src="https://picsum.photos/200/120?6">
      <p>Flex 2</p>
    </div>

    <div class="card flex-item">
      <img src="https://picsum.photos/200/120?7" width="200">
      <p>Flex 3</p>
    </div>

  </div>
</section>

<!-- COMBINATORS -->
<section>
  <h2>CSS Combinators</h2>

  <div class="parent">
    <p>Descendant Paragraph</p>
    <span>Direct Child Span</span>
    <img src="https://picsum.photos/200/120?8">
  </div>

  <h3>Sibling Heading</h3>
  <p>Adjacent Sibling</p>
  <p>General Sibling</p>
</section>

</body>
</html>
